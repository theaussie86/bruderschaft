<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYP - Screens und Navigation</title>
<!--
  PROTOTYP, WEGWERFCODE. Nicht in main mergen.
  Frage (Wayfinder-Ticket "Screens und Navigation"): Welche Screens braucht die App
  und wie navigiert man zwischen ihnen, getrennt für Mitglied und Admin, mobil zuerst?
  Runde 2: Variante A (Tab-Leiste) gewählt, auf 3 Tabs reduziert: Bestellen, Kalender, Profil.
  Archiv und Protokolle hängen am Termin, die Verwaltung für Admins steckt im Profil.
  Mobil Tab-Leiste unten, Desktop Sidebar links (nur App-Teil, nicht die öffentlichen Seiten).
  Rechts Rolle, Rundenstand und Breite umschalten. Alles im Speicher, Reload = Reset.
-->
<style>
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 -apple-system,system-ui,sans-serif;background:#d9d6cf;color:#1d1d1b}
  .stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:16px}
  .device{background:#faf8f4;border:10px solid #222;overflow:hidden;display:flex;flex-direction:column;position:relative}
  .device.mobile{width:390px;height:780px;border-radius:36px}
  .device.desktop{width:1060px;height:700px;border-radius:12px}
  .side{width:260px;font-size:13px;flex-shrink:0}
  .side h3{margin:12px 0 4px}
  .side pre{background:#fff;padding:8px;border-radius:6px;white-space:pre-wrap;font-size:11px}
  .side .scr{display:block;width:100%;text-align:left;border:0;background:none;padding:2px 4px;cursor:pointer;font-size:12px;border-radius:4px}
  .side .scr:hover{background:#fff}
  .side .scr.on{background:#1d1d1b;color:#fff}
  .app{flex:1;display:flex;min-height:0}
  .col{flex:1;display:flex;flex-direction:column;min-width:0}
  header.top{background:#1d1d1b;color:#faf8f4;padding:12px 14px;display:flex;align-items:center;gap:10px;min-height:52px}
  header.top b{flex:1;font-size:16px}
  header.top button{background:none;border:0;color:inherit;font-size:20px;cursor:pointer;padding:0 4px}
  header.light{background:#faf8f4;color:#1d1d1b;border-bottom:1px solid #e3dfd6}
  main{flex:1;overflow:auto;padding:14px}
  .desktop main{padding:24px 32px}
  .desktop main > .inner{max-width:640px}
  nav.tabs{display:flex;border-top:1px solid #ddd;background:#fff}
  nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 12px;font-size:11px;cursor:pointer;color:#777}
  nav.tabs button .i{display:block;font-size:20px}
  nav.tabs button.on{color:#1d1d1b;font-weight:600}
  aside.sidebar{width:220px;background:#1d1d1b;color:#faf8f4;padding:18px 0;display:flex;flex-direction:column}
  aside.sidebar .brand{padding:0 20px 18px;font-weight:700;font-size:17px}
  aside.sidebar button{display:block;width:100%;text-align:left;border:0;background:none;color:inherit;padding:10px 20px;font-size:14px;cursor:pointer;opacity:.75}
  aside.sidebar button.on{background:rgba(255,255,255,.12);opacity:1;font-weight:600}
  aside.sidebar small{display:block;padding:16px 20px 4px;opacity:.5;text-transform:uppercase;font-size:10px;letter-spacing:.06em}
  .seg{display:flex;background:#e8e3d8;border-radius:10px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;cursor:pointer;font-size:13px}
  .seg button.on{background:#fff;font-weight:600}
  h2{margin:4px 0 10px;font-size:20px}
  h4{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#777}
  .card{background:#fff;border:1px solid #e3dfd6;border-radius:12px;padding:12px;margin-bottom:10px}
  .card.click{cursor:pointer}
  .card.click:hover{border-color:#1d1d1b}
  .card.admin{border-color:#1d1d1b;border-style:dashed}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee}
  .row:last-child{border-bottom:0}
  .row.click{cursor:pointer}
  .muted{color:#888;font-size:13px}
  .btn{display:inline-block;border:0;background:#1d1d1b;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer;margin:4px 4px 4px 0}
  .btn.sec{background:#fff;color:#1d1d1b;border:1px solid #1d1d1b}
  .btn.warn{background:#a33}
  .btn.full{display:block;width:100%;margin:8px 0}
  .pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;background:#eee}
  .pill.ok{background:#d6ecd2}.pill.wip{background:#fbe7b5}.pill.no{background:#f2d0d0}.pill.grey{background:#e6e6e6;color:#666}
  .warnbox{background:#fff4d6;border:1px solid #e8c45a;border-radius:10px;padding:10px;font-size:13px;margin:8px 0}
  .hint{font-size:12px;color:#8a5a00;margin-top:-6px;margin-bottom:8px}
  input,select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font:inherit;margin:3px 0 10px;background:#fff}
  label{font-size:12px;color:#555}
  .modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:6}
  .desktop .modal{align-items:center}
  .modal .sheet{background:#faf8f4;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px;max-height:85%;overflow:auto}
  .desktop .modal .sheet{border-radius:14px}
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .desktop .thumbs{grid-template-columns:repeat(5,1fr)}
  .thumbs div{aspect-ratio:1;background:#cfc8b8;border-radius:4px}
  .banner{background:#ff2d75;color:#fff;text-align:center;font:600 11px system-ui;padding:3px}
  .pub{max-width:560px;margin:0 auto;width:100%}
</style>
</head>
<body>
<div class="banner">PROTOTYP - Wegwerfcode. Fragt nur: welche Screens, welche Navigation?</div>
<div class="stage">
  <div class="device mobile" id="device"></div>
  <div class="side" id="side"></div>
</div>

<script>
// ---------- Mock-Daten (fiktiv) ----------
const MEMBERS = [
  {name:'Andi', state:'fertig', paid:true},
  {name:'Basti', state:'in Arbeit'},
  {name:'Chris', state:'nichts eingetragen'},
  {name:'Dani', state:'Verzicht'},
  {name:'Erik', state:'fertig', note:true},
  {name:'Flo', state:'fertig', unavailable:true},
  {name:'Gregor', state:'in Arbeit', left:true},
];
const ARTICLES = [
  {name:'Hoodie schwarz', price:'45,00', sizes:['S','M','L','XL','XXL (+3,00)'], spots:[{n:'vorne',type:'Motiv',req:true,motifs:['Clublogo']},{n:'hinten',type:'Motiv',req:false,motifs:['Schriftzug','Clublogo groß']},{n:'Ärmel',type:'Text',req:false}]},
  {name:'Hoodie grau', price:'45,00', sizes:['S','M','L','XL'], spots:[{n:'vorne',type:'Motiv',req:true,motifs:['Clublogo']}]},
  {name:'T-Shirt', price:'20,00', sizes:['S','M','L','XL'], spots:[{n:'vorne',type:'Motiv',req:true,motifs:['Clublogo','Schriftzug']}]},
  {name:'Mütze', price:'18,00', sizes:['Einheitsgröße'], spots:[{n:'vorne',type:'Motiv',req:true,motifs:['Clublogo']}], hidden:true},
];
const UPCOMING = [
  {t:'Stammtisch', art:'Stammtisch', d:'Fr 20.11. 19:00', ort:'Vereinsheim'},
  {t:'Jahreshauptversammlung', art:'Sitzung', d:'Sa 05.12. 18:00', ort:'Gasthof'},
  {t:'Weihnachtsfeier', art:'Veranstaltung', d:'Sa 19.12. 18:00', ort:'Vereinsheim'},
  {t:'Ausfahrt Frühjahr', art:'Veranstaltung', d:'Sa 17.04.', ort:'Parkplatz', cancelled:true},
];
const PAST = [
  {t:'Herbstausfahrt', art:'Veranstaltung', d:'03.10.2026', ort:'Parkplatz', pics:9},
  {t:'Sitzung Oktober', art:'Sitzung', d:'08.10.2026', ort:'Vereinsheim', files:1},
  {t:'Sommerfest', art:'Veranstaltung', d:'12.07.2026', ort:'Vereinsheim', pics:24},
  {t:'Jahreshauptversammlung', art:'Sitzung', d:'06.12.2025', ort:'Gasthof', files:3},
];

// ---------- Zustand ----------
const S = {
  role:'mitglied', round:'offen', orderState:'in Arbeit', width:'mobile', when:'kommend',
  positions:[{a:'Hoodie schwarz',s:'L',spots:'vorne: Clublogo, hinten: Schriftzug',n:1,sum:'45,00'}],
  screen:null, params:null, stack:[], modal:null,
};
const TABS = [['bestellen','👕','Bestellen'],['kalender','📅','Kalender'],['profil','👤','Profil']];
const ADMIN = [['a.rounds','Bestellrunden'],['a.catalog','Sortiment'],['a.members','Mitglieder'],['a.settings','Einstellungen']];

// ---------- Screens: id -> {t: Titel, tab: zugehöriger Tab, r: render} ----------
const SCREENS = {
  // Öffentlich (ohne Tab-Leiste und ohne Sidebar)
  'pub.home': {t:'Club', tab:'pub', r:()=>`
    <div class="card"><h2>Willkommen beim Club</h2><p class="muted">Kurzer Text über den Club und ein Bild (pflegt der Admin).</p></div>
    <button class="btn full" onclick="go('pub.login')">Anmelden (für Mitglieder)</button>
    <p class="muted" style="text-align:center"><a href="#" onclick="return go('pub.impressum')">Impressum</a> · <a href="#" onclick="return go('pub.datenschutz')">Datenschutz</a></p>`},
  'pub.login': {t:'Anmelden', tab:'pub', r:()=>`
    <label>E-Mail</label><input><label>Passwort</label><input type="password">
    <button class="btn full" onclick="S.role='mitglied';reset()">Anmelden</button>
    <a href="#" onclick="return go('pub.forgot')">Passwort vergessen?</a>`},
  'pub.forgot': {t:'Passwort vergessen', tab:'pub', r:()=>`
    <p>Wir schicken dir einen Link zum Setzen eines neuen Passworts.</p><label>E-Mail</label><input><button class="btn full">Link schicken</button>`},
  'pub.setpw': {t:'Passwort setzen', tab:'pub', r:()=>`
    <p class="muted">Ziel des Einladungslinks (7 Tage gültig) und von "Passwort vergessen".</p>
    <label>Neues Passwort</label><input type="password"><label>Wiederholen</label><input type="password">
    <button class="btn full" onclick="S.role='mitglied';reset()">Passwort setzen und loslegen</button>`},
  'pub.impressum': {t:'Impressum', tab:'pub', r:()=>`<p class="muted">Statische Seite.</p>`},
  'pub.datenschutz': {t:'Datenschutz', tab:'pub', r:()=>`<p class="muted">Statische Seite.</p>`},

  // Tab Bestellen
  'bestellen': {t:'Bestellen', tab:'bestellen', r:renderRound},
  'b.article': {t:'Artikel wählen', tab:'bestellen', r:()=>ARTICLES.filter(a=>!a.hidden).map(a=>`
    <div class="card click" onclick="go('b.configure',{a:'${a.name}'})"><b>${a.name}</b><div class="muted">${a.price} € · ${a.sizes.length} Größen</div></div>`).join('')},
  'b.configure': {t:'Position', tab:'bestellen', r:(p)=>{const a=ARTICLES.find(x=>x.name===(p&&p.a))||ARTICLES[0]; return `
    <div class="card"><b>${a.name}</b> · ${a.price} €<div class="muted">Bild und Beschreibung, falls gepflegt</div></div>
    <label>Größe</label><select>${a.sizes.map(s=>`<option>${s}</option>`)}</select>
    ${a.spots.map(sp=>`<label>Druckstelle ${sp.n}${sp.req?' (Pflicht)':' (optional)'}</label>${sp.type==='Text'?'<input placeholder="Text, z. B. Spitzname">':`<select>${sp.req?'':'<option>- leer -</option>'}${sp.motifs.map(m=>`<option>${m}</option>`)}</select>`}`).join('')}
    <label>Anzahl</label><input type="number" value="1">
    <button class="btn full" onclick="S.positions.push({a:'${a.name}',s:'M',spots:'vorne: Clublogo',n:1,sum:'${a.price}'});S.orderState='in Arbeit';back()">In den Auftrag</button>`}},
  'b.history': {t:'Frühere Runden', tab:'bestellen', r:()=>`
    <div class="card"><b>Frühjahr 2026</b> <span class="pill ok">bezahlt</span>
    <div class="row"><span>T-Shirt M · vorne: Clublogo</span><span>20,00</span></div><div class="row"><span>Hoodie schwarz L · vorne: Clublogo</span><span>45,00</span></div><div class="row"><b>Summe</b><b>65,00 €</b></div></div>`},
  'b.overview': {t:'Übersicht der Runde', tab:'bestellen', admin:true, r:renderOverview},
  'b.memberorder': {t:'Auftrag von Basti', tab:'bestellen', admin:true, r:()=>`
    <p class="muted">Admin bearbeitet den Auftrag eines Mitglieds, solange die Runde offen ist.</p>
    <div class="card"><div class="row"><span>T-Shirt L · vorne: Schriftzug</span><span>20,00</span></div><div class="row"><b>Summe</b><b>20,00 €</b></div></div>
    <button class="btn sec" onclick="go('b.article')">+ Position</button>
    <label>Korrektur (Betrag + Begründung)</label><input placeholder="-5,00 Restposten">
    <label><input type="checkbox" style="width:auto"> bezahlt</label><br><button class="btn">Speichern</button>`},

  // Tab Kalender (inkl. Archiv und Protokolle)
  'kalender': {t:'Kalender', tab:'kalender', r:()=>`
    <div class="seg">${['kommend','vergangen'].map(w=>`<button class="${S.when===w?'on':''}" onclick="S.when='${w}';render()">${w==='kommend'?'Kommend':'Vergangen'}</button>`).join('')}</div>
    ${S.when==='kommend' ? UPCOMING.map((e,i)=>`<div class="card click" onclick="go('k.event',{up:${i}})"><div class="muted">${e.d} · ${e.art}</div><b style="${e.cancelled?'text-decoration:line-through':''}">${e.t}</b> ${e.cancelled?'<span class="pill no">abgesagt</span>':''}<div class="muted">${e.ort}</div></div>`).join('')
      : `<p class="muted">Veranstaltungen mit Bildern, Sitzungen mit Protokoll. Stammtische erscheinen hier nicht.</p>`+PAST.map((e,i)=>`<div class="card click" onclick="go('k.event',{past:${i}})"><div class="muted">${e.d} · ${e.art}</div><b>${e.t}</b><div class="muted">${e.art==='Veranstaltung'?`🖼 ${e.pics} Bilder`:`📄 Protokoll`}</div></div>`).join('')}
    ${isAdmin()?`<button class="btn full" onclick="go('k.edit')">+ Termin anlegen</button>`:''}`},
  'k.event': {t:'Termin', tab:'kalender', r:(p)=>{
    const past = p && p.past!==undefined; const e = past ? PAST[p.past] : UPCOMING[(p&&p.up)||0];
    return `<div class="muted">${e.art}</div><h2>${e.t}</h2><p>${e.d}<br>${e.ort}</p><p class="muted">Infotext zum Termin.</p>
    ${past && e.art==='Veranstaltung' ? `<h4>Bilder</h4><button class="btn sec full">Bilder hochladen</button><div class="thumbs">${Array(e.pics||0).fill('<div></div>').join('')}</div><p class="muted">Tippen = Vollbild. Eigene Bilder löschbar${isAdmin()?', als Admin alle':''}.</p>`:''}
    ${past && e.art==='Sitzung' ? `<h4>Protokoll</h4><div class="card">📄 protokoll.pdf</div>${isAdmin()?`<button class="btn sec">Protokoll hochladen / ändern</button>`:''}`:''}
    ${isAdmin()?`<h4>Admin</h4><button class="btn sec" onclick="go('k.edit')">Bearbeiten</button><button class="btn sec">Kopieren</button>${past?'':'<button class="btn sec">Absagen</button>'}`:''}`}},
  'k.edit': {t:'Termin bearbeiten', tab:'kalender', admin:true, r:()=>`
    <label>Titel</label><input><label>Art</label><select><option>Stammtisch</option><option>Sitzung</option><option>Veranstaltung</option></select>
    <label>Beginn</label><input type="datetime-local"><label><input type="checkbox" style="width:auto"> ganztägig</label><br>
    <label>Ende (optional)</label><input type="datetime-local"><label>Ort</label><input><label>Infotext</label><textarea></textarea>
    <p class="muted">Auch rückwirkend möglich, damit ältere Feste ins Archiv kommen.</p><button class="btn full">Speichern</button>`},

  // Tab Profil (inkl. Verwaltung für Admins)
  'profil': {t:'Profil', tab:'profil', r:()=>`
    <div class="card"><b>Andi</b><div class="muted">andi@beispiel.de · ändern nur über den Admin</div></div>
    <button class="btn sec full">Passwort ändern</button>
    <button class="btn sec full" onclick="openModal('ical')">Kalender abonnieren</button>
    ${isAdmin()&&S.width==='mobile'?`<h4>Verwaltung</h4><div class="card">${ADMIN.map(([id,l])=>`<div class="row click" onclick="go('${id}')"><span>${l}</span>›</div>`).join('')}</div>`:''}
    <button class="btn sec full" onclick="S.role='gast';reset()">Abmelden</button>`},
  'a.rounds': {t:'Bestellrunden', tab:'profil', admin:true, r:()=>`
    ${S.round!=='offen'?`<button class="btn full" onclick="openModal('newround')">+ Neue Bestellrunde</button>`:''}
    <div class="card click" onclick="go('b.overview')"><b>Herbst 2026</b> <span class="pill ${S.round==='offen'?'wip':'grey'}">${S.round==='offen'?'offen':'abgeschlossen'}</span></div>
    <div class="card click" onclick="go('a.closedround')"><b>Frühjahr 2026</b> <span class="pill grey">abgeschlossen</span></div>`},
  'a.closedround': {t:'Frühjahr 2026', tab:'profil', admin:true, r:()=>`
    <span class="pill grey">abgeschlossen</span> <span class="muted">Preise festgehalten</span>
    <h4>Sammelbestellung</h4><button class="btn">PDF</button><button class="btn">Excel</button>
    <h4>Mitglieder</h4>${MEMBERS.slice(0,4).map(m=>`<div class="row"><span>${m.name}</span><span class="pill ${m.paid?'ok':'no'}">${m.paid?'bezahlt':'offen'}</span></div>`).join('')}
    <button class="btn sec full" ${S.round==='offen'?'disabled title="Eine andere Runde ist offen"':''}>Wieder öffnen</button>`},
  'a.catalog': {t:'Sortiment', tab:'profil', admin:true, r:()=>`
    <div class="muted">Reihenfolge per Ziehen. Ausgeblendete ausgegraut.</div>
    ${ARTICLES.map(a=>`<div class="row click" onclick="go('a.article',{a:'${a.name}'})"><span>☰ ${a.name} ${a.hidden?'<span class="pill grey">ausgeblendet</span>':''}</span><span class="muted">${a.price} ›</span></div>`).join('')}
    <button class="btn full" onclick="go('a.article')">+ Artikel</button><button class="btn sec full" onclick="go('a.motifs')">Motive verwalten</button>`},
  'a.article': {t:'Artikel bearbeiten', tab:'profil', admin:true, r:(p)=>{const a=ARTICLES.find(x=>x.name===(p&&p.a))||ARTICLES[0]; return `
    <label>Name</label><input value="${a.name}"><label>Preis (inkl. Aufdruck)</label><input value="${a.price}"><label>Bild, Beschreibung</label><input placeholder="optional">
    <h4>Größen</h4>${a.sizes.map(s=>`<div class="row"><span>☰ ${s}</span><span class="muted">Aufpreis · ausblenden</span></div>`).join('')}<button class="btn sec">+ Größe</button>
    <h4>Druckstellen</h4>${a.spots.map(s=>`<div class="card"><b>${s.n}</b> · ${s.type==='Text'?'Textfeld':'Motivauswahl'} · ${s.req?'Pflicht':'optional'}<div class="muted">${s.motifs?'Erlaubt: '+s.motifs.join(', '):'Freitext'} · Aufpreis 0,00</div></div>`).join('')}<button class="btn sec">+ Druckstelle</button>
    <h4>Aktionen</h4><button class="btn sec">Kopieren (z. B. andere Farbe)</button><button class="btn sec">Ausblenden</button>`}},
  'a.motifs': {t:'Motive', tab:'profil', admin:true, r:()=>`
    ${['Clublogo','Schriftzug','Clublogo groß'].map(m=>`<div class="row"><span>☰ 🖼 ${m}</span><span class="muted">ausblenden</span></div>`).join('')}<button class="btn full">+ Motiv</button>`},
  'a.members': {t:'Mitglieder', tab:'profil', admin:true, r:()=>`
    <button class="btn full" onclick="go('a.member',{neu:1})">+ Mitglied einladen</button>
    ${MEMBERS.map((m,i)=>`<div class="row click" onclick="go('a.member')"><span>${m.name}${i===0?' <span class="pill">Admin</span>':''}</span><span class="pill ${m.left?'grey':i===2?'wip':'ok'}">${m.left?'gesperrt':i===2?'eingeladen':'aktiv'}</span></div>`).join('')}`},
  'a.member': {t:'Mitglied', tab:'profil', admin:true, r:(p)=> p&&p.neu ? `
    <label>Name</label><input><label>E-Mail</label><input><button class="btn full">Einladung schicken</button>` : `
    <label>Name</label><input value="Chris"><label>E-Mail</label><input value="chris@beispiel.de"><span class="pill wip">eingeladen</span>
    <button class="btn sec full">Erneut einladen</button><button class="btn sec full">Admin-Recht geben</button>
    <button class="btn sec full">Sperren (Austritt)</button><button class="btn warn full">Daten löschen (DSGVO)</button>`},
  'a.settings': {t:'Einstellungen', tab:'profil', admin:true, r:()=>`
    <label>Zahlungshinweis (Bank, Verwendungszweck)</label><textarea>IBAN ..., Verwendungszweck: Name + Runde</textarea>
    <label>Text der öffentlichen Startseite</label><textarea>Über den Club ...</textarea>
    <h4>Kalender-Abo</h4><button class="btn sec">Neuen geheimen Link erzeugen</button>`},
};

function renderRound(){
  const sum = S.positions.reduce((t,p)=>t+parseFloat(p.sum.replace(',','.'))*p.n,0).toFixed(2).replace('.',',');
  const adminCard = isAdmin()&&S.round!=='keine' ? `<div class="card click admin" onclick="go('b.overview')"><b>Admin: Übersicht der Runde ›</b><div class="muted">3 von 7 erledigt · 1 bezahlt</div></div>` : '';
  const history = `<div class="row click" onclick="go('b.history')"><span>Frühere Runden</span>›</div>`;
  if(S.round==='keine') return `<div class="card"><h2>Gerade keine Bestellrunde</h2><p class="muted">Sobald ein Admin eine eröffnet, bestellst du hier.</p></div>
    ${isAdmin()?`<button class="btn full" onclick="openModal('newround')">+ Neue Bestellrunde</button>`:''}${history}`;
  const list = S.positions.map((p,i)=>`<div class="row"><span>${p.n}× ${p.a} ${p.s}<div class="muted">${p.spots}</div></span><span>${p.sum}${S.round==='offen'&&S.orderState!=='fertig'?` <a href="#" onclick="S.positions.splice(${i},1);render();return false">✕</a>`:''}</span></div>`).join('') || '<div class="muted">Noch nichts drin.</div>';
  if(S.round==='abgeschlossen') return adminCard+`<div class="muted">Herbst 2026 · abgeschlossen</div><h2>Dein Auftrag</h2>
    <div class="card">${list}<div class="row"><b>Summe</b><b>${sum} €</b></div></div><span class="pill no">noch nicht bezahlt</span>
    <div class="card" style="margin-top:10px"><b>Zahlungshinweis</b><div class="muted">IBAN ..., Verwendungszweck: Name + Herbst 2026</div></div>${history}`;
  return adminCard+`<div class="muted">Herbst 2026 · Bestelldatum 30.11.</div><h2>Dein Auftrag <span class="pill ${['fertig','Verzicht'].includes(S.orderState)?'ok':'wip'}">${S.orderState}</span></h2>
    ${S.orderState==='Verzicht'?`<div class="card">Du bestellst diesmal nichts.</div><button class="btn sec full" onclick="S.orderState='in Arbeit';render()">Doch bestellen</button>`:`
    <div class="card">${list}<div class="row"><b>Summe</b><b>${sum} €</b></div></div>
    ${S.orderState==='fertig'?`<button class="btn sec full" onclick="S.orderState='in Arbeit';render()">Wieder öffnen</button>`:`
    <button class="btn sec full" onclick="go('b.article')">+ Position hinzufügen</button>
    <label>Anmerkung</label><textarea placeholder="z. B. Hoodie bitte etwas länger"></textarea><div class="hint">Der Drucker sieht diesen Text.</div>
    <button class="btn full" onclick="S.orderState='fertig';render()">Bin fertig</button>
    <button class="btn sec full" onclick="S.orderState='Verzicht';render()">Diesmal nichts</button>`}`}${history}`;
}
function renderOverview(){
  const pill = s => ({'fertig':'ok','Verzicht':'ok','in Arbeit':'wip','nichts eingetragen':'no'})[s];
  return `<div class="muted">Herbst 2026 · ${S.round}</div>
    <div class="card"><div class="row"><span>erledigt (fertig + Verzicht)</span><b>4 / ${MEMBERS.length}</b></div><div class="row"><span>bezahlt</span><b>1</b></div></div>
    ${MEMBERS.map(m=>`<div class="row click" onclick="go('b.memberorder')"><span>${m.name} ${m.left?'<span class="pill grey">ausgetreten</span>':''}${m.unavailable?' <span class="pill no">nicht verfügbar</span>':''}${m.note?' 💬':''}</span><span><span class="pill ${pill(m.state)}">${m.state}</span>${m.state==='fertig'?` <span class="pill ${m.paid?'ok':'grey'}">${m.paid?'€ ✓':'€'}</span>`:''}</span></div>`).join('')}
    ${S.round==='offen'?`<button class="btn full" onclick="openModal('close')">Runde abschließen</button>`:`
      <h4>Sammelbestellung</h4><button class="btn">PDF</button><button class="btn">Excel</button><button class="btn sec full" onclick="S.round='offen';render()">Wieder öffnen</button>`}`;
}
const MODALS = {
  close: ()=>`<h2>Runde abschließen?</h2>
    <div class="warnbox">⚠ 3 Aufträge noch nicht fertig (Basti, Chris, Gregor)</div><div class="warnbox">⚠ 1 Position nicht mehr verfügbar (Flo: Mütze)</div>
    <label>Nicht fertige Aufträge</label><select><option>mitnehmen</option><option>weglassen</option></select>
    <p class="muted">Preise werden beim Abschließen festgehalten.</p>
    <button class="btn full" onclick="S.round='abgeschlossen';closeModal()">Abschließen</button><button class="btn sec full" onclick="closeModal()">Abbrechen</button>`,
  newround: ()=>`<h2>Neue Bestellrunde</h2><label>Name</label><input value="Frühjahr 2027"><label>Bestelldatum (nur Ansage)</label><input type="date">
    <button class="btn full" onclick="S.round='offen';S.orderState='nichts eingetragen';S.positions=[];closeModal()">Eröffnen</button><button class="btn sec full" onclick="closeModal()">Abbrechen</button>`,
  ical: ()=>`<h2>Kalender abonnieren</h2><input value="https://.../ical/geheim-a8f3..." readonly><button class="btn full" onclick="closeModal()">Link kopieren</button><p class="muted">In Google- oder Apple-Kalender als Abo einfügen.</p>`,
};

// ---------- Navigation ----------
const isAdmin = () => S.role==='admin';
const cur = () => SCREENS[S.screen];
function go(id,params){S.stack.push({id:S.screen,params:S.params});S.screen=id;S.params=params;render();return false}
function back(){const p=S.stack.pop();if(p){S.screen=p.id;S.params=p.params}render()}
function tab(id){S.stack=[];S.screen=id;S.params=null;render()}
function reset(){S.stack=[];S.params=null;S.screen=S.role==='gast'?'pub.home':'bestellen';render()}
function openModal(m){S.modal=m;render()}
function closeModal(){S.modal=null;render()}

function render(){
  const s = cur(), desk = S.width==='desktop';
  const dev = document.getElementById('device'); dev.className = 'device '+S.width;
  const header = `<header class="top ${s.tab==='pub'?'light':''}">${S.stack.length?`<button onclick="back()">‹</button>`:''}<b>${s.t}</b></header>`;
  const content = `<main><div class="inner ${s.tab==='pub'?'pub':''}">${s.r(S.params)}</div></main>`;
  let html;
  if(s.tab==='pub'){
    html = header + content;                         // öffentlich: schlicht, keine App-Navigation
  } else if(desk){
    const activeId = s.admin && s.tab==='profil' ? (S.stack.find(x=>ADMIN.some(a=>a[0]===x.id))||{}).id || S.screen : null;
    html = `<div class="app"><aside class="sidebar"><div class="brand">Club</div>
      ${TABS.map(([id,i,l])=>`<button class="${s.tab===id&&!s.admin?'on':''}" onclick="tab('${id}')">${i} ${l}</button>`).join('')}
      ${isAdmin()?`<small>Verwaltung</small>${ADMIN.map(([id,l])=>`<button class="${activeId===id?'on':''}" onclick="tab('${id}')">${l}</button>`).join('')}`:''}
      </aside><div class="col">${header}${content}</div></div>`;
  } else {
    html = header + content + `<nav class="tabs">${TABS.map(([id,i,l])=>`<button class="${s.tab===id?'on':''}" onclick="tab('${id}')"><span class="i">${i}</span>${l}</button>`).join('')}</nav>`;
  }
  if(S.modal) html += `<div class="modal" onclick="closeModal()"><div class="sheet" onclick="event.stopPropagation()">${MODALS[S.modal]()}</div></div>`;
  dev.innerHTML = html;

  const groups = {'Öffentlich':[], 'Bestellen':[], 'Kalender':[], 'Profil':[]};
  const name = {pub:'Öffentlich', bestellen:'Bestellen', kalender:'Kalender', profil:'Profil'};
  for(const [id,x] of Object.entries(SCREENS)) groups[name[x.tab]].push([id,x]);
  document.getElementById('side').innerHTML = `
    <h3>Breite</h3>${['mobile','desktop'].map(w=>`<button class="btn ${S.width===w?'':'sec'}" onclick="S.width='${w}';render()">${w==='mobile'?'Mobil':'Desktop'}</button>`).join('')}
    <h3>Rolle</h3>${['gast','mitglied','admin'].map(r=>`<button class="btn ${S.role===r?'':'sec'}" onclick="S.role='${r}';reset()">${r}</button>`).join('')}
    <h3>Bestellrunde</h3>${['offen','abgeschlossen','keine'].map(r=>`<button class="btn ${S.round===r?'':'sec'}" onclick="S.round='${r}';render()">${r}</button>`).join('')}
    <h3>Screens (${Object.keys(SCREENS).length})</h3>
    ${Object.entries(groups).map(([g,l])=>`<b>${g}</b>${l.map(([id,x])=>`<button class="scr ${S.screen===id?'on':''}" onclick="tab('${id}')">${x.admin?'⚙ ':''}${x.t}</button>`).join('')}`).join('')}
    <p class="muted">⚙ = nur Admin</p>
    <h3>Zustand</h3><pre>${JSON.stringify({breite:S.width,rolle:S.role,screen:S.screen,stack:S.stack.map(x=>x.id),runde:S.round,auftrag:S.orderState},null,1)}</pre>`;
}
reset();
</script>
</body>
</html>
